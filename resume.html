<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>簡歷 Resume</title>

  <!-- Google 字體 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f4f4f4;
      --text-color: #000;
      --header-bg: #1f2937;
      --card-bg: #fff;
      --link-color: #fff;
      --accent-blue: #007bff;
      --title-color: #fff;
    }

    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --text-color: #f0f0f0;
      --header-bg: #1a1a1a;
      --card-bg: #2a2a2a;
      --link-color: #ccc;
      --accent-blue: #66aaff;
      --title-color: #fff;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    header {
      background: var(--header-bg);
      color: var(--link-color);
      padding: 20px 0;
    }

    .header-container {
      width: 90%;
      max-width: 960px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    header h1 {
      flex: 1 1 100%;
      text-align: center;
      font-size: 24px;
      margin-bottom: 10px;
      color: var(--title-color);
    }

    .navbar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .navbar a {
      color: var(--link-color);
      text-decoration: none;
      font-size: 16px;
    }

    .navbar a:hover {
      text-decoration: underline;
    }

    .theme-toggle {
      background-color: transparent;
      border: 1px solid var(--link-color);
      color: var(--link-color);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .theme-toggle:hover {
      background-color: var(--link-color);
      color: var(--header-bg);
    }

    .container {
      width: 90%;
      max-width: 960px;
      margin: auto;
      padding: 20px;
    }

    .section {
      background-color: var(--card-bg);
      padding: 20px;
      border-radius: 10px;
      margin-top: 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    .section h3 {
      border-left: 5px solid var(--accent-blue);
      padding-left: 10px;
      margin-bottom: 20px;
      font-size: 20px;
    }

    .resume-img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    footer {
      text-align: center;
      padding: 20px;
      background-color: #1f2937;
      color: white;
      margin-top: 40px;
      border-top: 4px solid #3b82f6;
    }
  </style>
</head>
<body>
  <!-- 頁首 -->
  <header>
    <div class="header-container">
      <h1>簡歷 Resume</h1>
      <nav class="navbar">
        <a href="https://wilson112112.github.io/myfile/">Myfile</a>
        <a href="https://wilson3818518.wixsite.com/my-site-1">Creation</a>
        <a href="about.html">About me</a>
        <a href="resume.html">Resume</a>
      </nav>
      <button id="theme-toggle" class="theme-toggle">Dark</button>
    </div>
  </header>

  <!-- 主內容 -->
  <div class="container">
    <div class="section">
      <h3>簡歷 Resume</h3>
      <img src="img/resumeCV.jpg" alt="個人簡歷圖片" class="resume-img">
    </div>
  </div>

  <!-- 頁尾 -->
  <footer>
    &copy; 2025 曾宥維. All rights reserved.
  </footer>

  <!-- 亮暗模式 JS -->
  <script>
    // 初次載入時：讀取使用者上次選擇的主題
    const storedTheme = localStorage.getItem("theme");
    const html = document.documentElement;
    const toggle = document.getElementById('theme-toggle');
  
    if (storedTheme === "dark") {
      html.setAttribute("data-theme", "dark");
      toggle.textContent = "Light";
    } else {
      html.removeAttribute("data-theme");
      toggle.textContent = "Dark";
    }
  
    // 點擊按鈕切換主題
    toggle.addEventListener("click", () => {
      const currentTheme = html.getAttribute("data-theme");
      if (currentTheme === "dark") {
        html.removeAttribute("data-theme");
        localStorage.setItem("theme", "light");
        toggle.textContent = "Dark";
      } else {
        html.setAttribute("data-theme", "dark");
        localStorage.setItem("theme", "dark");
        toggle.textContent = "Light";
      }
    });
  </script>
  
</body>
</html>
