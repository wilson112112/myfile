<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wilson Zeng — Resume</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --surface2: #f0ede8;
      --text: #1a1816;
      --text-muted: #6b6560;
      --accent: #408dba;
      --accent2: #0057b8;
      --border: #e2ddd8;
      --header-bg: #1a1816;
      --header-text: #f7f5f2;
      --shadow: 0 2px 20px rgba(0,0,0,0.07);
      --shadow-hover: 0 8px 32px rgba(0,0,0,0.12);
    }
    [data-theme="dark"] {
      --bg: #111110;
      --surface: #1c1b1a;
      --surface2: #242322;
      --text: #f0ede8;
      --text-muted: #9a9590;
      --accent: #408dba;
      --accent2: #4d8fdc;
      --border: #2e2d2b;
      --header-bg: #0d0d0c;
      --header-text: #f0ede8;
      --shadow: 0 2px 20px rgba(0,0,0,0.3);
      --shadow-hover: 0 8px 32px rgba(0,0,0,0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.3s, color 0.3s;
      line-height: 1.6;
    }

    /* ── HEADER ── */
    header {
      background: var(--header-bg);
      color: var(--header-text);
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .header-inner {
      max-width: 1000px;
      margin: auto;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: var(--header-text);
      opacity: 0.95;
      text-decoration: none;
    }
    .logo span { color: var(--accent); }
    nav {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    nav a {
      color: rgba(240,237,232,0.7);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
      letter-spacing: 0.02em;
    }
    nav a:hover { color: var(--header-text); background: rgba(255,255,255,0.08); }
    nav a.active { color: var(--header-text); background: rgba(255,255,255,0.1); }
    #theme-toggle {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: rgba(240,237,232,0.8);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      margin-left: 8px;
      transition: all 0.2s;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    #theme-toggle:hover { background: rgba(255,255,255,0.15); color: #fff; }

    /* ── MAIN ── */
    main {
      max-width: 1000px;
      margin: auto;
      padding: 40px 32px 80px;
    }

    /* ── PAGE TITLE ── */
    .page-header {
      padding: 40px 0 36px;
      border-bottom: 1px solid var(--border);
      animation: fadeUp 0.6s ease both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .page-tag {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .page-tag::before {
      content: '';
      width: 18px;
      height: 2px;
      background: var(--accent);
      display: inline-block;
    }
    .page-header h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.15;
    }
    .page-header p {
      color: var(--text-muted);
      margin-top: 8px;
      font-size: 15px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-top: 32px;
      animation: fadeUp 0.6s 0.1s ease both;
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .card-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-icon {
      width: 36px;
      height: 36px;
      background: var(--surface2);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .card-icon svg { color: var(--accent2); }
    .card h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 18px;
      font-weight: 400;
    }

    /* Download button */
    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      border-radius: 8px;
      letter-spacing: 0.03em;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-download:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn-download svg { flex-shrink: 0; }

    /* Resume image */
    .resume-img-wrap {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-hover);
      line-height: 0;
    }
    .resume-img-wrap img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.4s ease;
    }
    .resume-img-wrap:hover img { transform: scale(1.01); }

    /* Tip banner */
    .tip-banner {
      margin-top: 20px;
      padding: 14px 18px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent2);
      border-radius: 8px;
      font-size: 13.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tip-banner svg { flex-shrink: 0; color: var(--accent2); }

    /* ── FOOTER ── */
    footer {
      background: var(--header-bg);
      color: rgba(240,237,232,0.5);
      text-align: center;
      font-size: 13px;
      padding: 24px;
      border-top: 3px solid var(--accent);
      letter-spacing: 0.03em;
    }
    footer strong { color: rgba(240,237,232,0.85); }

    @media (max-width: 680px) {
      .header-inner { padding: 0 20px; }
      main { padding: 24px 20px 60px; }
      nav a { display: none; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="about.html">Wilson<span>.</span></a>
    <nav>
      <a href="https://wilson112112.github.io/myfile/">About me</a>
      <a href="creation.html">Creation</a>
      <a href="about.html">Myfile</a>
      <a href="resume.html">Resume</a>
      <button id="theme-toggle">Dark</button>
    </nav>
  </div>
</header>

<main>
  <!-- Page heading -->
  <div class="page-header">
    <div class="page-tag">Curriculum Vitae</div>
    <h1>簡歷<br><span style="font-style:italic; color:var(--text-muted); font-size:0.68em;">Resume</span></h1>
    <p>ZENG YOU WEI · 曾宥維</p>
  </div>

  <!-- Resume card -->
  <div class="card">
    <div class="card-header">
      <div class="card-title-row">
        <div class="card-icon">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <h3>Resume / CV</h3>
      </div>
      <a href="img/resumeCV.jpg" download="Wilson_Zeng_Resume.jpg" class="btn-download">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download
      </a>
    </div>

    <div class="resume-img-wrap">
      <img src="img/resumeCV.jpg" alt="Wilson Zeng Resume">
    </div>
  </div>
</main>

<footer>
  &copy; 2026 <strong>曾宥維 Wilson Zeng</strong> · All rights reserved.
</footer>

<script>
  const html = document.documentElement;
  const toggle = document.getElementById("theme-toggle");

  // Restore saved theme
  const stored = localStorage.getItem("theme");
  if (stored === "dark") {
    html.setAttribute("data-theme", "dark");
    toggle.textContent = "Light";
  }

  toggle.addEventListener("click", () => {
    const dark = html.getAttribute("data-theme") === "dark";
    html.setAttribute("data-theme", dark ? "light" : "dark");
    localStorage.setItem("theme", dark ? "light" : "dark");
    toggle.textContent = dark ? "Dark" : "Light";
  });

  document.addEventListener("contextmenu", e => e.preventDefault());
  document.addEventListener("keydown", e => {
    if (e.ctrlKey && ["u","s","I"].includes(e.key)) e.preventDefault();
  });
</script>
</body>
</html>
